name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/generate_runtime_config.py
      - run: python3 scripts/generate_runtime_config.py --check
      - run: python3 -m unittest discover -s tests -v
